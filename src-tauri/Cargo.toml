[package]
name = "storage-studio-kh"
version = "0.1.29"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
ureq = "2"
ed25519-dalek = "2"
base64 = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# Screenshots (RELEASE-POLICY §5d): WKWebView.takeSnapshot through the window Tauri already owns.
# The sources are already in Cargo.lock through wry; these are direct entries so code may use them.
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-web-kit = "0.3"
block2 = "0.6"

[features]
custom-protocol = ["tauri/custom-protocol"]
