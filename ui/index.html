<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Storage Studio KH</title>
  </head>
  <body>
    <div class="app">
      <nav class="nav" id="nav" aria-label="Settings sections"></nav>
      <main class="main" id="main" tabindex="-1"></main>
      <div class="foot" id="foot"></div>
    </div>

    <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
    <div class="row-menu" id="row-menu" role="menu" hidden></div>

    <dialog class="sheet" id="editor" aria-labelledby="editor-title"></dialog>
    <dialog class="sheet" id="whatsnew" aria-labelledby="whatsnew-title"></dialog>
    <dialog class="sheet" id="credentials" aria-labelledby="credentials-title"></dialog>
    <dialog class="sheet" id="archive-sheet" aria-labelledby="archive-sheet-title"></dialog>
    <dialog class="sheet" id="restore-sheet" aria-labelledby="restore-sheet-title"></dialog>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
